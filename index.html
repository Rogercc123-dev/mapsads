<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldBid — Own the map</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121c;color:#fff;font-family:Inter,Arial,sans-serif}#map{position:fixed;inset:0;width:100%;height:100%}.country{fill:#17394c;stroke:#506b7a;stroke-width:.55;cursor:pointer;transition:filter .12s}.country:hover{fill:#2c6b83;stroke:#7cf2ff;stroke-width:1.2;filter:drop-shadow(0 0 5px #45e9ff)}.country.taken{filter:saturate(1.25)}.top,.bottom,.tip,.modalCard{background:#07131eea;border:1px solid #ffffff25;box-shadow:0 14px 55px #0009;backdrop-filter:blur(16px)}.top{position:fixed;z-index:10;top:12px;left:12px;right:12px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.brand{font-size:21px;font-weight:1000;letter-spacing:-1.5px}.brand b{color:#59eaff}.nav{display:flex;gap:6px}.btn,.cta{border:0;border-radius:9px;padding:9px 12px;background:#ffffff0b;color:#fff;font-size:9px;font-weight:900;cursor:pointer}.btn:hover{background:#ffffff18}.stats{font-size:8px;color:#9eb0bb}.stats b{color:#fff}.bottom{position:fixed;z-index:10;left:50%;bottom:14px;transform:translateX(-50%);width:min(680px,calc(100vw - 28px));border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px}.mLogo{width:50px;height:50px;flex:none;border-radius:11px;background:#112d3d;display:grid;place-items:center;overflow:hidden;font-weight:1000}.mLogo img{width:100%;height:100%;object-fit:contain}.copy{flex:1;min-width:0}.ey{font-size:7px;color:#59eaff;font-weight:1000;letter-spacing:1.1px}.name{font-size:14px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:8px;color:#9eb0bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cta{background:#59eaff;color:#031018}.tip{position:fixed;z-index:20;display:none;min-width:205px;max-width:270px;border-radius:13px;padding:12px;pointer-events:none}.tip.show{display:block}.tip h3{margin:4px 0;font-size:16px}.tip p{margin:4px 0;color:#a4b5c0;font-size:8px}.adrow{display:flex;gap:8px;align-items:center;margin-top:9px}.adlogo{width:34px;height:34px;border-radius:8px;background:#112d3d;display:grid;place-items:center;overflow:hidden;font-size:8px;font-weight:1000}.adlogo img{width:100%;height:100%;object-fit:contain}.tip button{margin-top:10px;width:100%;border:0;border-radius:8px;padding:9px;background:#baff55;color:#071000;font-size:8px;font-weight:1000;pointer-events:auto;cursor:pointer}.modal{position:fixed;z-index:50;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalCard{width:min(490px,100%);border-radius:17px;padding:19px}.close{float:right;border:0;background:#ffffff0b;color:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}.modal h2{margin:0 38px 3px 0}.sub{font-size:9px;color:#9eb0bb;margin-bottom:15px}.field{margin:11px 0}.field label{display:block;font-size:7px;color:#9eb0bb;font-weight:1000;letter-spacing:1px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #294554;background:#040b11;color:#fff;outline:0}.field textarea{min-height:60px;resize:vertical}.pick{position:relative;padding:11px;border:1px dashed #4a6675;border-radius:8px;color:#a8b9c3;font-size:9px}.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}.publish{width:100%;border:0;border-radius:9px;padding:12px;background:#59eaff;color:#031018;font-weight:1000;cursor:pointer}.status{position:fixed;z-index:9;top:77px;left:50%;transform:translateX(-50%);font-size:8px;color:#9eb0bb;background:#07131eb8;border:1px solid #ffffff16;border-radius:99px;padding:7px 11px}.status b{color:#baff55}@media(max-width:700px){.nav,.stats{display:none}.top{top:7px;left:7px;right:7px}.bottom{bottom:7px}.tip{max-width:225px}}</style></head><body><svg id="map" viewBox="0 0 1400 760"></svg><header class="top"><div class="brand">WORLD<b>BID</b></div><div class="nav"><button class="btn" id="how">HOW IT WORKS</button><button class="btn" id="advertise">ADVERTISE</button></div><div class="stats"><b id="claimed">0</b> CLAIMED · <b id="brands">0</b> BRANDS</div></header><div class="status"><b>● LIVE MARKET</b> · <span id="statusText">loading world…</span></div><section class="bottom"><div class="mLogo" id="mainLogo">W</div><div class="copy"><div class="ey" id="mainEy">WORLD ADVERTISING MARKET</div><div class="name" id="mainName">Hover a country</div><div class="meta" id="mainMeta">Every country is an advertising opportunity.</div></div><button class="cta" id="mainCta">ADVERTISE</button></section><div class="tip" id="tip"><div class="ey" id="tipEy">AVAILABLE AD SPACE</div><h3 id="tipName">Country</h3><div class="adrow" id="adrow"></div><p id="tipMeta">Starting bid: 50 credits</p><button id="tipCta">CLAIM THIS COUNTRY</button></div><div class="modal" id="modal"><div class="modalCard"><button class="close" id="close">×</button><h2 id="modalTitle">Advertise</h2><div class="sub" id="modalSub">Put your brand on the map.</div><form id="form"><div class="field"><label>BRAND NAME</label><input id="brand" maxlength="48" required></div><div class="field"><label>WEBSITE</label><input id="site" type="url" placeholder="https://example.com" required></div><div class="field"><label>LOGO FILE</label><div class="pick"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><b>Choose logo</b> · PNG/JPG/WEBP/SVG · 2MB</div></div><div class="field"><label>ADVERTISING MESSAGE</label><textarea id="tag" maxlength="120"></textarea></div><div class="field"><label>BID</label><input id="bid" type="number" min="50" value="50" required></div><button class="publish">PUBLISH ADVERTISEMENT</button></form></div></div><script type="module">import*as d3 from 'https://cdn.jsdelivr.net/npm/d3-geo@3/+esm';import{createClient}from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=id=>document.getElementById(id);const SUPA_URL='https://luyfcactbetelcplulrz.supabase.co';const SUPA_KEY='sb_publishable_ZT5L4j-zgJHsHlezWl67BQ_-1BBXNad';const supabase=createClient(SUPA_URL,SUPA_KEY);const GEO='https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/countries.geojson';const palette=['#55eaff','#ff58b2','#baff55','#ffd34d','#a778ff','#ff745d','#43ffb0','#ff9348'];let countries=[],owners=new Map,selected=null,logoData='';async function load(){try{$('statusText').textContent='loading advertisers…';const{data:ads,error}=await supabase.from('country_ads').select('country_id,country_name,advertiser_id,bid,advertisers(id,brand_name,website,logo_url,tagline,color)');if(!error&&ads){ads.filter(x=>x.advertiser_id&&x.advertisers).forEach(x=>owners.set(String(x.country_id),{brand:x.advertisers.brand_name,site:x.advertisers.website,logo:x.advertisers.logo_url,tag:x.advertisers.tagline,bid:Number(x.bid||0),color:x.advertisers.color||palette[0],advertiserId:x.advertiser_id}))}const r=await fetch(GEO,{cache:'force-cache'});if(!r.ok)throw Error('GeoJSON HTTP '+r.status);const geo=await r.json();countries=geo.features.filter(f=>f.geometry&&(f.properties?.name||f.properties?.ADMIN));$('statusText').textContent='ready';draw();await ensureAnonymousSession()}catch(e){console.error(e);$('statusText').textContent='map data failed';$('mainName').textContent='Map failed to load';$('mainMeta').textContent='Check your connection and refresh.'}}function draw(){const svg=d3.select('#map');svg.selectAll('*').remove();const projection=d3.geoNaturalEarth1().fitExtent([[12,24],[1388,738]],{type:'Sphere'}),path=d3.geoPath(projection),root=svg.append('g'),layer=root.append('g'),markers=root.append('g');layer.selectAll('path.country').data(countries).join('path').attr('class',d=>'country '+(owners.has(countryKey(d))?'taken':'')).attr('d',path).attr('fill',d=>owners.get(countryKey(d))?.color||'#17394c').on('mouseenter',e=>showTip(e,e.currentTarget.__data__)).on('mousemove',moveTip).on('mouseleave',()=> $('tip').classList.remove('show')).on('click',(e,d)=>{selected=d;updateBottom()});renderMarkers(markers,projection);const zoom=d3.zoom().scaleExtent([1,7]).on('zoom',e=>root.attr('transform',e.transform));svg.call(zoom)}function countryKey(d){return String(d.properties?.ISO_A3||d.properties?.ADM0_A3||d.properties?.iso_a3||d.properties?.name||d.properties?.ADMIN||d.id)}function countryName(d){return d.properties?.name||d.properties?.ADMIN||'Country'}function renderMarkers(markers,projection){const groups=new Map;owners.forEach((o,id)=>{if(!groups.has(o.brand))groups.set(o.brand,[]);groups.get(o.brand).push(id)});groups.forEach((ids,brand)=>{const pts=ids.map(id=>{const c=countries.find(x=>countryKey(x)===id);return c?projection(d3.geoCentroid(c)):null}).filter(Boolean);if(!pts.length)return;const x=pts.reduce((s,p)=>s+p[0],0)/pts.length,y=pts.reduce((s,p)=>s+p[1],0)/pts.length,o=owners.get(ids[0]),w=Math.min(205,112+brand.length*4),g=markers.append('g').attr('transform',`translate(${x},${y})`).attr('pointer-events','none');g.append('rect').attr('x',-w/2).attr('y',-21).attr('width',w).attr('height',42).attr('rx',10).attr('fill','#07131ef4').attr('stroke',o.color).attr('stroke-width',1.5);if(o.logo)g.append('image').attr('href',o.logo).attr('x',-w/2+5).attr('y',-16).attr('width',32).attr('height',32);g.append('text').attr('x',-w/2+44).attr('y',1).attr('fill','#fff').attr('font-size',Math.min(15,10+Math.sqrt(ids.length)*2)).attr('font-weight','900').text(brand.slice(0,22));g.append('text').attr('x',-w/2+44).attr('y',13).attr('fill','#9eb0bb').attr('font-size',7).text(ids.length+' '+(ids.length===1?'country':'countries'))})$('claimed').textContent=owners.size;$('brands').textContent=new Set([...owners.values()].map(o=>o.brand)).size}function showTip(e,d){const o=owners.get(countryKey(d));$('tipEy').textContent=o?'CURRENT ADVERTISER':'AVAILABLE AD SPACE';$('tipName').textContent=countryName(d);$('tipMeta').textContent=o?`${o.site} · Current bid ${o.bid} credits`:'Starting bid: 50 credits';const row=$('adrow');row.innerHTML='';if(o){const l=document.createElement('div');l.className='adlogo';if(o.logo){const im=document.createElement('img');im.src=o.logo;l.append(im)}else l.textContent=o.brand.slice(0,2).toUpperCase();const s=document.createElement('div');s.innerHTML='<b>'+escapeHtml(o.brand)+'</b><div style="font-size:8px;color:#9eb0bb">'+escapeHtml(o.tag||'Advertising placement')+'</div>';row.append(l,s);$('tipCta').textContent='OUTBID ADVERTISER'}else $('tipCta').textContent='CLAIM THIS COUNTRY';$('tip').classList.add('show');moveTip(e);$('tipCta').onclick=()=>openAd(d)}function moveTip(e){const t=$('tip'),r=t.getBoundingClientRect();let x=e.clientX+15,y=e.clientY+15;if(x+r.width>innerWidth-8)x=e.clientX-r.width-15;if(y+r.height>innerHeight-8)y=e.clientY-r.height-15;t.style.left=x+'px';t.style.top=y+'px'}function updateBottom(){const o=selected&&owners.get(countryKey(selected));$('mainEy').textContent=o?'CURRENT ADVERTISER':'WORLD ADVERTISING MARKET';$('mainName').textContent=o?o.brand:countryName(selected);$('mainMeta').textContent=o?`${o.site} · Current bid ${o.bid} credits`:'Open advertising space';$('mainCta').textContent=o?'OUTBID':'ADVERTISE';$('mainCta').onclick=()=>openAd(selected||countries[0]);if(o?.logo)$('mainLogo').innerHTML='<img src="'+o.logo+'">';else $('mainLogo').textContent=o?o.brand.slice(0,1).toUpperCase():'W'}function openAd(d){selected=d;const o=owners.get(countryKey(d)),min=o?Math.ceil(o.bid*1.15):50;$('modalTitle').textContent=o?'Outbid '+o.brand:'Advertise in '+countryName(d);$('modalSub').textContent=o?'Beat the current bid to take this placement.':'Create your advertising placement.';$('bid').value=min;$('bid').min=min;$('modal').classList.add('show')}async function ensureAnonymousSession(){try{await supabase.auth.getSession()}catch(e){}}$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2097152)return alert('Logo must be under 2MB');const r=new FileReader;r.onload=()=>logoData=r.result;r.readAsDataURL(f)};$('form').onsubmit=async e=>{e.preventDefault();if(!selected)return;const id=countryKey(selected),old=owners.get(id),bid=Number($('bid').value),min=old?Math.ceil(old.bid*1.15):50;if(bid<min)return alert('Minimum bid: '+min);const brand=$('brand').value.trim(),site=$('site').value.trim(),tag=$('tag').value.trim(),color=palette[new Set([...owners.values()].map(x=>x.brand)).size%palette.length];$('modal').classList.remove('show');$('statusText').textContent='saving…';let advertiserId=null;const{data:a,error:ae}=await supabase.from('advertisers').insert({brand_name:brand,website:site,logo_url:logoData||null,tagline:tag,color}).select('id').single();if(!ae)advertiserId=a.id;else console.warn('advertiser insert:',ae.message);if(advertiserId){const{error:ce}=await supabase.from('country_ads').upsert({country_id:id,country_name:countryName(selected),advertiser_id:advertiserId,bid});if(ce)console.warn('country ad save:',ce.message)}owners.set(id,{brand,site,tag,logo:logoData,bid,color,advertiserId});draw();updateBottom();$('statusText').textContent='live'};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('advertise').onclick=()=>openAd(selected||countries[0]);$('mainCta').onclick=()=>openAd(selected||countries[0]);$('how').onclick=()=>alert('Hover a country to see its advertising status. Empty countries can be claimed. Existing advertisers can be outbid by placing a higher bid. Logos are uploaded from your files.');function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load()</script></body></html>

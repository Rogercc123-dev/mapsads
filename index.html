<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldBid</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121c;color:#fff;font-family:Arial,sans-serif}#map{position:fixed;inset:0;width:100%;height:100%}.country{fill:#17394c;stroke:#637b88;stroke-width:.55;cursor:pointer}.country:hover{fill:#2c718d;stroke:#72efff;stroke-width:1.3}.top,.bottom,.tip{position:fixed;z-index:5;background:#07131eee;border:1px solid #ffffff25;box-shadow:0 14px 55px #0009;backdrop-filter:blur(14px)}.top{top:12px;left:12px;right:12px;height:52px;border-radius:14px;padding:0 14px;display:flex;align-items:center;justify-content:space-between}.word{font-size:21px;font-weight:1000;letter-spacing:-1.5px}.word span{color:#59eaff}.nav{display:flex;gap:6px}.btn,.cta,.tipAction{border:0;border-radius:9px;padding:9px 12px;background:#ffffff0c;color:#fff;font-size:9px;font-weight:900;cursor:pointer}.btn:hover{background:#ffffff18}.cta{background:#59eaff;color:#031018}.stats{font-size:8px;color:#9eb0bb}.stats b{color:#fff}.status{position:fixed;z-index:6;top:76px;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:99px;background:#07131ebd;border:1px solid #ffffff16;font-size:8px;color:#9eb0bb}.status b{color:#baff55}.bottom{left:50%;bottom:14px;transform:translateX(-50%);width:min(680px,calc(100% - 28px));border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px}.mainLogo{width:50px;height:50px;flex:none;border-radius:11px;background:#102d3d;display:grid;place-items:center;overflow:hidden;font-weight:1000}.mainLogo img{width:100%;height:100%;object-fit:contain}.copy{flex:1;min-width:0}.ey{font-size:7px;color:#59eaff;font-weight:1000;letter-spacing:1px}.name{font-size:14px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:8px;color:#9eb0bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tip{display:none;min-width:205px;max-width:260px;border-radius:13px;padding:12px;pointer-events:none}.tip.show{display:block}.tip h3{margin:4px 0;font-size:16px}.tip p{margin:5px 0;color:#a4b5c0;font-size:8px}.adrow{display:flex;gap:8px;align-items:center;margin-top:8px}.adlogo{width:38px;height:38px;border-radius:8px;background:#102d3d;display:grid;place-items:center;overflow:hidden;font-size:8px;font-weight:1000}.adlogo img{width:100%;height:100%;object-fit:contain}.tipAction{margin-top:9px;width:100%;background:#baff55;color:#071000;pointer-events:auto}.modal{position:fixed;z-index:20;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.card{width:min(470px,100%);background:#091923;border:1px solid #ffffff22;border-radius:16px;padding:18px}.card h2{margin:0 35px 4px}.sub{font-size:9px;color:#9eb0bb;margin-bottom:15px}.field{margin:10px 0}.field label{display:block;font-size:7px;color:#9eb0bb;font-weight:900;letter-spacing:1px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #294554;background:#040b11;color:#fff}.field textarea{min-height:55px}.pick{position:relative;border:1px dashed #456170;border-radius:8px;padding:11px;color:#a9bac4;font-size:9px}.pick input{position:absolute;inset:0;opacity:0}.publish{width:100%;border:0;border-radius:9px;padding:12px;background:#59eaff;color:#031018;font-weight:1000}.close{float:right;border:0;background:#ffffff0b;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}@media(max-width:650px){.nav,.stats{display:none}.top{top:7px;left:7px;right:7px}.bottom{bottom:7px}}</style></head><body><svg id="map" viewBox="0 0 1400 760"></svg><header class="top"><div class="word">WORLD<span>BID</span></div><div class="nav"><button class="btn" id="how">HOW IT WORKS</button><button class="btn" id="advertise">ADVERTISE</button></div><div class="stats"><b id="claimed">0</b> CLAIMED · <b id="brands">0</b> BRANDS</div></header><div class="status"><b>● LIVE MARKET</b> · <span id="statusText">Loading map…</span></div><section class="bottom"><div class="mainLogo" id="mainLogo">W</div><div class="copy"><div class="ey" id="mainEy">WORLD ADVERTISING MARKET</div><div class="name" id="mainName">Hover a country</div><div class="meta" id="mainMeta">Right-click a country to open its bid page.</div></div><button class="cta" id="mainCta">ADVERTISE</button></section><div class="tip" id="tip"><div class="ey" id="tipEy">AVAILABLE AD SPACE</div><h3 id="tipName">Country</h3><div class="adrow" id="adrow"></div><p id="tipMeta">Starting bid: £50</p><button class="tipAction" id="tipAction">CLAIM THIS COUNTRY</button></div><div class="modal" id="modal"><div class="card"><button class="close" id="close">×</button><h2 id="modalTitle">Claim country</h2><div class="sub">Your brand will appear on the map when you win.</div><form id="form"><div class="field"><label>BRAND NAME · MAX 32</label><input id="brand" maxlength="32" required></div><div class="field"><label>WEBSITE</label><input id="site" type="url" maxlength="160" required placeholder="https://example.com"></div><div class="field"><label>LOGO · MAX 2MB</label><div class="pick"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><b id="fileText">Choose logo file</b></div></div><div class="field"><label>MESSAGE · MAX 120</label><textarea id="tag" maxlength="120"></textarea></div><div class="field"><label>BID · GBP</label><input id="bid" type="number" min="50" value="50" required></div><button class="publish">CONTINUE TO PAYMENT</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script>(async function(){'use strict';const $=id=>document.getElementById(id);let countries=[],selected=null,logoData='';const owners={};const colors=['#55eaff','#ff58b2','#baff55','#ffd34d','#a778ff','#ff745d','#43ffb0','#ff9348'];function setStatus(s){$('statusText').textContent=s}function countryName(d){return d&&d.properties&&(d.properties.name||d.properties.NAME||d.properties.ADMIN)||'Country'}function openBid(d){selected=d;const o=owners[String(d.id)],min=o?Math.ceil(o.bid*1.15):50;$('modalTitle').textContent=o?'Outbid '+o.brand:'Claim '+countryName(d);$('bid').value=min;$('bid').min=min;$('modal').classList.add('show')}function updateBottom(){const o=selected&&owners[String(selected.id)];$('mainEy').textContent=o?'CURRENT ADVERTISER':'WORLD ADVERTISING MARKET';$('mainName').textContent=o?o.brand:countryName(selected);$('mainMeta').textContent=o?o.site+' · Current bid £'+o.bid:'Right-click to open the bid page';$('mainCta').textContent=o?'OUTBID':'ADVERTISE';if(o&&o.logo)$('mainLogo').innerHTML='<img src="'+o.logo+'">';else $('mainLogo').textContent=o?o.brand[0].toUpperCase():'W'}function showTip(e,d){const o=owners[String(d.id)];$('tipEy').textContent=o?'CURRENT ADVERTISER':'AVAILABLE AD SPACE';$('tipName').textContent=countryName(d);$('tipMeta').textContent=o?o.site+' · Current bid £'+o.bid:'Starting bid: £50';const row=$('adrow');row.innerHTML='';if(o){const l=document.createElement('div');l.className='adlogo';if(o.logo){const im=document.createElement('img');im.src=o.logo;l.appendChild(im)}else l.textContent=o.brand.slice(0,2).toUpperCase();const s=document.createElement('div');s.innerHTML='<b>'+o.brand+'</b><div style="font-size:8px;color:#9eb0bb">'+(o.tag||'Advertising placement')+'</div>';row.append(l,s)}$('tipAction').textContent=o?'OUTBID ADVERTISER':'CLAIM THIS COUNTRY';$('tip').classList.add('show');moveTip(e);$('tipAction').onclick=()=>openBid(d)}function moveTip(e){const t=$('tip'),r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;t.style.left=x+'px';t.style.top=y+'px'}function draw(data){countries=topojson.feature(data,data.objects.countries).features;const svg=d3.select('#map'),projection=d3.geoNaturalEarth1().fitExtent([[10,20],[1390,740]],{type:'Sphere'}),path=d3.geoPath(projection),root=svg.append('g'),layer=root.append('g'),marks=root.append('g');layer.selectAll('path.country').data(countries).join('path').attr('class','country').attr('d',path).attr('fill',d=>owners[String(d.id)]?.color||'#17394c').on('mouseenter',showTip).on('mousemove',moveTip).on('mouseleave',()=>$('tip').classList.remove('show')).on('click',(e,d)=>{selected=d;updateBottom()}).on('contextmenu',(e,d)=>{e.preventDefault();openBid(d)});const zoom=d3.zoom().scaleExtent([1,8]).on('zoom',e=>root.attr('transform',e.transform));svg.call(zoom);updateBottom();$('mainCta').onclick=()=>openBid(selected||countries[0])}function bind(){ $('close').onclick=()=>$('modal').classList.remove('show');$('advertise').onclick=()=>openBid(selected||countries[0]);$('how').onclick=()=>alert('Hover a country to see its advertising status. Right-click to open the bid page. Higher bids can take existing territory.');$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2097152)return alert('Logo must be under 2MB');$('fileText').textContent=f.name;const r=new FileReader();r.onload=()=>logoData=r.result;r.readAsDataURL(f)};$('form').onsubmit=e=>{e.preventDefault();if(!selected)return;const id=String(selected.id),old=owners[id],b=Number($('bid').value),min=old?Math.ceil(old.bid*1.15):50;if(b<min)return alert('Minimum bid is £'+min);const n=$('brand').value.trim();owners[id]={brand:n,site:$('site').value.trim(),tag:$('tag').value.trim(),logo:logoData,bid:b,color:colors[Object.keys(owners).length%colors.length]};$('modal').classList.remove('show');document.querySelectorAll('.country').attr?null:null;document.querySelectorAll('path.country').forEach(p=>{const id2=p.__data__?.id;if(id2&&owners[String(id2)])p.setAttribute('fill',owners[String(id2)].color)});updateBottom()}}try{if(typeof d3==='undefined'||typeof topojson==='undefined')throw Error('libraries');setStatus('loading world…');const r=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',{cache:'force-cache'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();draw(data);bind();setStatus('live')}catch(e){console.error(e);setStatus('map failed');$('mainName').textContent='Map failed to load';$('mainMeta').textContent='Please refresh the page.'}})();</script></body></html>

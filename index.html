<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldBid</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;color:#fff;font-family:system-ui,sans-serif}#map{width:100%;height:100%;display:block}.country{fill:#17384a;stroke:#587486;stroke-width:.6;cursor:pointer}.country:hover{fill:#28647d;stroke:#6df1ff;stroke-width:1.2}.top,.bottom,.tip{position:fixed;z-index:5;background:#07131ee8;border:1px solid #ffffff25;backdrop-filter:blur(14px);box-shadow:0 12px 50px #0008}.top{top:12px;left:12px;right:12px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.logo{font-weight:1000;font-size:21px;letter-spacing:-.07em}.logo span{color:#59eaff}.btn{border:0;background:#ffffff0d;color:#fff;padding:9px 12px;border-radius:9px;font-weight:900;font-size:9px;cursor:pointer}.btn:hover{background:#ffffff18}.stats{font-size:8px;color:#9db0bd}.stats b{color:#fff}.bottom{left:50%;bottom:13px;transform:translateX(-50%);width:min(650px,calc(100% - 30px));border-radius:15px;padding:10px;display:flex;gap:10px;align-items:center}.logoBox{width:48px;height:48px;border-radius:10px;background:#112b3a;display:grid;place-items:center;overflow:hidden;font-weight:1000;flex:none}.logoBox img{width:100%;height:100%;object-fit:contain}.copy{flex:1;min-width:0}.eyebrow{font-size:7px;color:#59eaff;font-weight:900;letter-spacing:.12em}.name{font-size:14px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:8px;color:#9db0bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cta{border:0;background:#59eaff;color:#031018;border-radius:9px;padding:11px 13px;font-size:9px;font-weight:1000;cursor:pointer}.tip{display:none;min-width:190px;max-width:250px;border-radius:12px;padding:11px;pointer-events:none}.tip.show{display:block}.t1{font-size:7px;color:#59eaff;font-weight:900;letter-spacing:.12em}.t2{font-size:15px;font-weight:1000;margin-top:3px}.t3{font-size:8px;color:#9db0bd;margin-top:3px}.tipBrand{display:flex;align-items:center;gap:8px;margin-top:8px}.tipLogo{width:32px;height:32px;border-radius:7px;background:#112b3a;display:grid;place-items:center;overflow:hidden;font-size:8px;font-weight:900}.tipLogo img{width:100%;height:100%;object-fit:contain}.claim{margin-top:9px;width:100%;border:0;border-radius:8px;padding:8px;background:#baff55;color:#071000;font-size:8px;font-weight:1000;pointer-events:auto;cursor:pointer}.modal{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.card{width:min(470px,100%);background:#091823;border:1px solid #ffffff22;border-radius:16px;padding:18px}.card h2{margin:0 0 4px}.sub{font-size:9px;color:#9db0bd;margin-bottom:16px}.field{margin:10px 0}.field label{display:block;font-size:7px;color:#9db0bd;text-transform:uppercase;font-weight:900;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #294353;background:#040b11;color:#fff}.field textarea{min-height:55px}.pick{position:relative;border:1px dashed #466071;border-radius:8px;padding:11px;font-size:9px;color:#a9bac4}.pick input{position:absolute;inset:0;opacity:0}.publish{width:100%;border:0;border-radius:9px;padding:11px;background:#59eaff;color:#031018;font-weight:1000}.close{float:right;background:#ffffff0d;border:0;color:#fff;border-radius:7px;padding:5px 9px}@media(max-width:650px){.top{top:7px;left:7px;right:7px}.top .nav{display:none}.bottom{bottom:7px}.stats{display:none}}</style></head><body><svg id="map" viewBox="0 0 1400 760"></svg><header class="top"><div class="logo">WORLD<span>BID</span></div><div class="nav"><button class="btn" id="how">HOW IT WORKS</button> <button class="btn" id="advertise">ADVERTISE</button></div><div class="stats"><b id="claimed">0</b> CLAIMED · <b id="brands">0</b> BRANDS</div></header><section class="bottom"><div class="logoBox" id="mainLogo">W</div><div class="copy"><div class="eyebrow" id="ey">WORLD ADVERTISING MARKET</div><div class="name" id="mainName">Hover a country</div><div class="meta" id="mainMeta">Advertisers appear directly on the map.</div></div><button class="cta" id="mainCta">ADVERTISE</button></section><div class="tip" id="tip"><div class="t1" id="tipEy">AVAILABLE AD SPACE</div><div class="t2" id="tipName">Country</div><div class="tipBrand" id="tipBrand"></div><div class="t3" id="tipMeta">Starting bid: 50</div><button class="claim" id="tipCta">CLAIM THIS COUNTRY</button></div><div class="modal" id="modal"><div class="card"><button class="close" id="close">×</button><h2 id="modalTitle">Advertise</h2><div class="sub" id="modalSub">Put your brand on the map.</div><form id="form"><div class="field"><label>Brand name</label><input id="brand" required></div><div class="field"><label>Website</label><input id="site" type="url" required placeholder="https://example.com"></div><div class="field"><label>Logo file</label><div class="pick"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><b>Choose logo</b> · PNG/JPG/WEBP/SVG · 2MB</div></div><div class="field"><label>Message</label><textarea id="tag"></textarea></div><div class="field"><label>Bid</label><input id="bid" type="number" min="50" value="50" required></div><button class="publish">PUBLISH ADVERTISEMENT</button></form></div></div><script>const worldUrl='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';const topoUrl='https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js';const d3Url='https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';function load(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}let svg,root,layer,marks,projection,path,countries=[],owners=new Map,selected=null,logoData='';const palette=['#55eaff','#ff58b2','#baff55','#ffd34d','#a778ff','#ff745d','#43ffb0','#ff9348'];async function init(){try{await load(d3Url);await load(topoUrl);const data=await fetch(worldUrl).then(r=>{if(!r.ok)throw Error('map data');return r.json()});countries=topojson.feature(data,data.objects.countries).features;svg=d3.select('#map');projection=d3.geoNaturalEarth1().fitExtent([[15,20],[1385,740]],{type:'Sphere'});path=d3.geoPath(projection);root=svg.append('g');layer=root.append('g');marks=root.append('g');render();bind()}catch(e){document.body.innerHTML='<div style="display:grid;place-items:center;width:100%;height:100%;background:#07111b;color:#fff;font:700 20px system-ui">WORLD<span style="color:#59eaff">BID</span><small style="display:block;font-size:11px;color:#8fa3b1">Map failed to load — refresh to retry.</small></div>'}}function render(){layer.selectAll('path').data(countries).join('path').attr('class','country').attr('d',path).attr('fill',d=>owners.get(+d.id)?.color||'#17384a').on('mouseenter',hover).on('mousemove',move).on('mouseleave',hide).on('click',(e,d)=>{selected=d;updateBottom()});marks.selectAll('*').remove();const groups=new Map;owners.forEach((o,id)=>{if(!groups.has(o.brand))groups.set(o.brand,[]);groups.get(o.brand).push(id)});groups.forEach((ids,brand)=>{const pts=ids.map(id=>projection(d3.geoCentroid(countries.find(c=>+c.id===+id))));const x=pts.reduce((s,p)=>s+p[0],0)/pts.length,y=pts.reduce((s,p)=>s+p[1],0)/pts.length,o=owners.get(+ids[0]),w=Math.min(190,105+brand.length*4),g=marks.append('g').attr('class','marker').attr('transform',`translate(${x},${y})`);g.append('rect').attr('x',-w/2).attr('y',-20).attr('width',w).attr('height',40).attr('rx',10).attr('fill','#07131ee8').attr('stroke',o.color);if(o.logo)g.append('image').attr('href',o.logo).attr('x',-w/2+5).attr('y',-15).attr('width',30).attr('height',30);g.append('text').attr('x',-w/2+42).attr('y',0).attr('fill','#fff').attr('font-size',Math.min(15,10+Math.sqrt(ids.length)*2)).attr('font-weight','900').text(brand.slice(0,20));g.append('text').attr('x',-w/2+42).attr('y',12).attr('fill','#9db0bd').attr('font-size','7').text(ids.length+' '+(ids.length===1?'country':'countries'))})$('claimed').textContent=owners.size;$('brands').textContent=new Set([...owners.values()].map(o=>o.brand)).size}function hover(e,d){const o=owners.get(+d.id);$('tipEy').textContent=o?'CURRENT ADVERTISER':'AVAILABLE AD SPACE';$('tipName').textContent=d.properties?.name||'Country';$('tipMeta').textContent=o?`${o.site} · Current bid ${o.bid}`:'Starting bid: 50 credits';const b=$('tipBrand');b.innerHTML='';if(o){const l=document.createElement('div');l.className='tipLogo';if(o.logo){const im=document.createElement('img');im.src=o.logo;l.appendChild(im)}else l.textContent=o.brand.slice(0,2).toUpperCase();const s=document.createElement('div');s.innerHTML=`<b>${o.brand}</b><div style="font-size:8px;color:#9db0bd">Advertising placement</div>`;b.append(l,s);$('tipCta').textContent='OUTBID ADVERTISER'}else{$('tipCta').textContent='CLAIM THIS COUNTRY'}$('tip').classList.add('show');move(e);$('tipCta').onclick=()=>openAd(d)}function move(e){const t=$('tip'),r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;t.style.left=x+'px';t.style.top=y+'px'}function hide(){$('tip').classList.remove('show')}function updateBottom(){const o=selected&&owners.get(+selected.id);$('mainName').textContent=o?o.brand:(selected?.properties?.name||'Hover a country');$('mainMeta').textContent=o?`${o.site} · Current bid ${o.bid} credits`:'Open advertising space';$('mainCta').textContent=o?'OUTBID':'ADVERTISE';if(o?.logo)$('mainLogo').innerHTML=`<img src="${o.logo}">`;else $('mainLogo').textContent=o?o.brand.slice(0,1).toUpperCase():'W'}function openAd(d){selected=d;const o=owners.get(+d.id),min=o?Math.ceil(o.bid*1.15):50;$('modalTitle').textContent=o?'Outbid '+o.brand:'Advertise in '+(d.properties?.name||'this country');$('modalSub').textContent=o?'Beat the current bid to take the placement.':'Create your advertising placement.';$('bid').value=min;$('bid').min=min;$('modal').classList.add('show')}function bind(){document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f||f.size>2097152)return alert('Logo must be under 2MB');const r=new FileReader;r.onload=()=>logoData=r.result;r.readAsDataURL(f)};$('form').onsubmit=e=>{e.preventDefault();const id=+selected.id,o=owners.get(id),b=+$('bid').value,min=o?Math.ceil(o.bid*1.15):50;if(b<min)return alert('Minimum bid: '+min);owners.set(id,{brand:$('brand').value.trim(),site:$('site').value.trim(),tag:$('tag').value.trim(),logo:logoData,bid:b,color:palette[new Set([...owners.values()].map(x=>x.brand)).size%palette.length]});$('modal').classList.remove('show');render();updateBottom()};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('advertise').onclick=()=>openAd(selected||countries[0]);$('mainCta').onclick=()=>openAd(selected||countries[0]);$('how').onclick=()=>alert('Choose a country, upload your logo, enter your website and place a bid. Existing advertising space can be outbid.')}init();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WorldBid — Own advertising space on Earth</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:#fff;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}svg{width:100%;height:100%;display:block}.country{fill:#163142;stroke:#456579;stroke-width:.55;vector-effect:non-scaling-stroke;cursor:pointer}.country:hover{fill:#28536a;stroke:#5de8ff;filter:drop-shadow(0 0 5px #5de8ff)}.top,.market,.hud,.tools{position:fixed;z-index:5;background:#06111ddd;border:1px solid #ffffff20;backdrop-filter:blur(15px)}.top{top:14px;left:14px;right:14px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.logo{font-size:20px;font-weight:1000;letter-spacing:-.07em}.logo span{color:#55e7ff}.links{display:flex;gap:5px}.links button,.tools button{border:0;background:#ffffff08;color:#c2cbd3;border-radius:9px;padding:8px 11px;font-size:9px;font-weight:900;cursor:pointer}.links button:hover{background:#ffffff14;color:#fff}.stats{display:flex;gap:7px}.stat{font-size:8px;color:#9badb9;background:#ffffff08;padding:7px 9px;border-radius:8px}.stat b{color:#fff;margin-right:3px}.hud{top:78px;left:50%;transform:translateX(-50%);border-radius:999px;padding:7px 12px;font-size:8px;color:#a7b7c2;white-space:nowrap}.hud b{color:#b9ff5a}.market{bottom:15px;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 30px));border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 18px 70px #0009}.mLogo{width:50px;height:50px;border-radius:11px;background:#102636;display:grid;place-items:center;overflow:hidden;font-weight:1000;flex:none}.mLogo img{width:100%;height:100%;object-fit:contain}.mText{min-width:0;flex:1}.ey{font-size:7px;color:#55e7ff;font-weight:900;letter-spacing:.13em}.name{font-size:14px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:8px;color:#92a6b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action{border:0;border-radius:10px;background:#55e7ff;color:#041018;padding:11px 13px;font-size:9px;font-weight:1000;cursor:pointer}.tools{left:15px;bottom:15px;border-radius:10px;overflow:hidden;display:flex}.tools button{width:38px;height:36px;border-radius:0;background:transparent;font-size:17px}.marker{pointer-events:none}.marker rect{fill:#06111bef;stroke:#ffffff30}.marker text{fill:#fff;font-weight:1000}.marker .small{fill:#9fb1be;font-size:8px}.modal{position:fixed;z-index:20;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.card{width:min(500px,100%);background:#081621;border:1px solid #ffffff20;border-radius:17px;overflow:auto;max-height:90vh}.head{padding:16px 18px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between}.head h2{margin:0;font-size:20px}.head p{margin:4px 0;font-size:9px;color:#91a5b4}.close{border:1px solid #ffffff16;background:#ffffff08;color:#fff;border-radius:8px;width:32px;height:32px}.form{padding:17px}.field{margin-bottom:12px}.field label{display:block;font-size:7px;color:#9eb1bf;letter-spacing:.12em;text-transform:uppercase;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px;background:#040c13;border:1px solid #263b4b;border-radius:9px;color:#fff}.field textarea{min-height:65px}.pick{position:relative;padding:12px;border:1px dashed #385163;border-radius:9px;background:#040c13;color:#a5b5c0;font-size:9px}.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}.submit{width:100%;border:0;border-radius:10px;background:#55e7ff;color:#041018;padding:12px;font-weight:1000;cursor:pointer}@media(max-width:700px){.links,.stats{display:none}.top{top:8px;left:8px;right:8px}.hud{top:67px}.market{bottom:8px}.tools{bottom:92px;left:8px}}</style></head><body><div id="app"><svg id="map" viewBox="0 0 1400 760"></svg><header class="top"><div class="logo">WORLD<span>BID</span></div><div class="links"><button id="how">HOW IT WORKS</button><button id="advertise">ADVERTISE</button></div><div class="stats"><div class="stat"><b id="claimed">0</b>CLAIMED</div><div class="stat"><b id="brands">0</b>BRANDS</div></div></header><div class="hud"><b>● LIVE MARKET</b> · Buy advertising space on the real world</div><div class="tools"><button id="plus">+</button><button id="minus">−</button><button id="home">⌂</button></div><section class="market"><div class="mLogo" id="mLogo">W</div><div class="mText"><div class="ey" id="ey">WORLD ADVERTISING MARKET</div><div class="name" id="mName">Pick a country. Put your brand on it.</div><div class="meta" id="mMeta">Advertisers are visible directly on the map.</div></div><button class="action" id="mAction">ADVERTISE HERE</button></section></div><div class="modal" id="modal"><div class="card"><div class="head"><div><h2 id="title">Advertise</h2><p id="sub">Put your brand on this country.</p></div><button class="close" id="close">×</button></div><form class="form" id="form"><div class="field"><label>Brand name</label><input id="brand" required maxlength="48" placeholder="Your company"></div><div class="field"><label>Website</label><input id="site" required type="url" placeholder="https://example.com"></div><div class="field"><label>Logo</label><div class="pick"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><b>Choose logo file</b> · PNG / JPG / WEBP / SVG · 2MB max</div></div><div class="field"><label>Advertising message</label><textarea id="tag" maxlength="120" placeholder="Your message"></textarea></div><div class="field"><label>Bid</label><input id="bid" type="number" min="50" required></div><button class="submit">PUBLISH ADVERTISEMENT</button></form></div></div><script type="module">import*as d3 from'https://cdn.jsdelivr.net/npm/d3@7/+esm';import{feature,mesh}from'https://cdn.jsdelivr.net/npm/topojson-client@3/+esm';import world from'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json/+esm';const svg=d3.select('#map'),countries=feature(world,world.objects.countries).features,borders=mesh(world,world.objects.countries,(a,b)=>a!==b),projection=d3.geoNaturalEarth1().fitExtent([[18,25],[1382,742]],{type:'Sphere'}),path=d3.geoPath(projection),root=svg.append('g'),layer=root.append('g'),markers=root.append('g');layer.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','#0a1a25');layer.append('path').datum(borders).attr('d',path).attr('fill','none').attr('stroke','#4c7186').attr('stroke-width','.5').attr('vector-effect','non-scaling-stroke').attr('pointer-events','none');const owners=new Map;let selected=null,logoData='';const colors=['#55e7ff','#ff5fb7','#b9ff5a','#ffd34d','#a77bff','#ff765f'];function render(){layer.selectAll('path.country').data(countries,d=>d.id).join('path').attr('class','country').attr('d',path).attr('fill',d=>owners.get(+d.id)?.color||'#163142').on('click',(e,d)=>{selected=d;showMarket()});markers.selectAll('*').remove();const groups=new Map;owners.forEach((o,id)=>{if(!groups.has(o.brand))groups.set(o.brand,[]);groups.get(o.brand).push(id)});groups.forEach((ids,brand)=>{const pts=ids.map(id=>projection(d3.geoCentroid(countries.find(c=>+c.id===+id))));const x=pts.reduce((s,p)=>s+p[0],0)/pts.length,y=pts.reduce((s,p)=>s+p[1],0)/pts.length,o=owners.get(+ids[0]),w=Math.min(230,120+brand.length*4),g=markers.append('g').attr('class','marker').attr('transform',`translate(${x},${y})`);g.append('rect').attr('x',-w/2).attr('y',-23).attr('width',w).attr('height',46).attr('rx',11);if(o.logo)g.append('image').attr('href',o.logo).attr('x',-w/2+5).attr('y',-18).attr('width',36).attr('height',36);g.append('text').attr('x',-w/2+47).attr('y',-2).attr('font-size',Math.min(18,10+Math.sqrt(ids.length)*2)).text(brand.slice(0,24));g.append('text').attr('class','small').attr('x',-w/2+47).attr('y',13).text(`${ids.length} ${ids.length===1?'country':'countries'}`)});claimed.textContent=owners.size;brands.textContent=new Set([...owners.values()].map(o=>o.brand)).size}function showMarket(){const o=selected&&owners.get(+selected.id);if(o?.logo)mLogo.innerHTML=`<img src="${o.logo}">`;else mLogo.textContent=o?o.brand[0].toUpperCase():'W';mName.textContent=o?o.brand:(selected?'Advertise in this country':'Pick a country. Put your brand on it.');mMeta.textContent=o?`${o.site} · Current bid ${o.bid} credits`:'Every unclaimed country is advertising space. Click one to begin.';mAction.textContent=o?'OUTBID':'ADVERTISE HERE';mAction.onclick=()=>openAd(selected||countries[0])}function openAd(d){selected=d;const o=owners.get(+d.id),min=o?Math.ceil(o.bid*1.15):50;title.textContent=o?`Outbid ${o.brand}`:`Advertise in this country`;sub.textContent=o?`Beat the current bid of ${o.bid} credits.`:'Publish your brand on the map.';bid.value=min;bid.min=min;modal.classList.add('open')}file.onchange=e=>{const f=e.target.files[0];if(!f||f.size>2097152)return;const r=new FileReader;r.onload=()=>logoData=r.result;r.readAsDataURL(f)};form.onsubmit=e=>{e.preventDefault();const id=+selected.id,o=owners.get(id),b=+bid.value,min=o?Math.ceil(o.bid*1.15):50;if(b<min)return alert(`Minimum bid: ${min}`);const brandValue=brand.value.trim();owners.set(id,{brand:brandValue,site:site.value.trim(),tag:tag.value.trim(),logo:logoData,bid:b,color:colors[new Set([...owners.values()].map(x=>x.brand)).size%colors.length]});localStorage.setItem('worldbidProfile',JSON.stringify({brand:brandValue,site:site.value.trim(),tag:tag.value.trim(),logo:logoData}));modal.classList.remove('open');render();showMarket()};close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};advertise.onclick=()=>openAd(selected||countries[0]);home.onclick=()=>svg.transition().call(zoom.transform,d3.zoomIdentity);plus.onclick=()=>svg.transition().call(zoom.scaleBy,1.5);minus.onclick=()=>svg.transition().call(zoom.scaleBy,.67);how.onclick=()=>alert('Choose a country, upload your logo, add your website and place a bid. A higher bid can replace the current advertiser.');const zoom=d3.zoom().scaleExtent([1,8]).on('zoom',e=>root.attr('transform',e.transform));svg.call(zoom);render();showMarket()})();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldBid</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07121c;color:#fff;font-family:Arial,sans-serif}#map{width:100vw;height:100vh;display:block}.country{fill:#18394b;stroke:#607b89;stroke-width:.55;cursor:pointer}.country:hover{fill:#2d6880;stroke:#65efff;stroke-width:1.2}.top,.bottom,.tip{position:fixed;z-index:10;background:#07131eed;border:1px solid #ffffff26;box-shadow:0 12px 45px #0009;backdrop-filter:blur(14px)}.top{top:12px;left:12px;right:12px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.logo{font-size:21px;font-weight:1000;letter-spacing:-1.5px}.logo b{color:#59eaff}.nav button,.cta{border:0;border-radius:9px;padding:9px 12px;background:#ffffff0d;color:#fff;font-size:9px;font-weight:900;cursor:pointer}.nav button:hover{background:#ffffff18}.stats{font-size:8px;color:#a4b4bf}.stats b{color:#fff}.bottom{left:50%;bottom:14px;transform:translateX(-50%);width:min(660px,calc(100% - 28px));border-radius:15px;padding:10px;display:flex;align-items:center;gap:10px}.mLogo{width:48px;height:48px;border-radius:10px;background:#112d3d;display:grid;place-items:center;overflow:hidden;font-weight:1000;flex:none}.mLogo img{width:100%;height:100%;object-fit:contain}.copy{flex:1;min-width:0}.ey{font-size:7px;color:#59eaff;font-weight:900;letter-spacing:1px}.name{font-size:14px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:8px;color:#9cafbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cta{background:#59eaff;color:#031018}.tip{display:none;min-width:190px;max-width:245px;border-radius:12px;padding:11px;pointer-events:none}.tip.show{display:block}.tip h3{margin:4px 0;font-size:15px}.tip p{margin:3px 0;color:#a4b4bf;font-size:8px}.advert{display:flex;gap:8px;align-items:center;margin-top:8px}.advertLogo{width:32px;height:32px;border-radius:7px;background:#112d3d;display:grid;place-items:center;overflow:hidden;font-size:8px;font-weight:900}.advertLogo img{width:100%;height:100%;object-fit:contain}.tip button{margin-top:9px;width:100%;border:0;border-radius:8px;padding:8px;background:#baff55;color:#071000;font-size:8px;font-weight:1000;pointer-events:auto;cursor:pointer}.modal{position:fixed;z-index:20;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.card{width:min(470px,100%);background:#091923;border:1px solid #ffffff24;border-radius:16px;padding:18px}.card h2{margin:0 35px 4px}.sub{font-size:9px;color:#9cafbb;margin-bottom:14px}.close{float:right;background:#ffffff0d;border:0;color:#fff;border-radius:7px;padding:6px 9px}.field{margin:10px 0}.field label{display:block;font-size:7px;color:#9cafbb;font-weight:900;letter-spacing:1px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #294453;background:#040c12;color:#fff}.field textarea{min-height:55px}.pick{position:relative;padding:11px;border:1px dashed #456170;border-radius:8px;color:#a9bac4;font-size:9px}.pick input{position:absolute;inset:0;opacity:0}.publish{width:100%;border:0;border-radius:9px;padding:11px;background:#59eaff;color:#031018;font-weight:1000}@media(max-width:650px){.nav,.stats{display:none}.top{top:7px;left:7px;right:7px}.bottom{bottom:7px}.tip{max-width:210px}}</style></head><body><svg id="map" viewBox="0 0 1400 760"></svg><header class="top"><div class="logo">WORLD<b>BID</b></div><div class="nav"><button id="how">HOW IT WORKS</button><button id="advertise">ADVERTISE</button></div><div class="stats"><b id="claimed">0</b> CLAIMED · <b id="brands">0</b> BRANDS</div></header><section class="bottom"><div class="mLogo" id="mainLogo">W</div><div class="copy"><div class="ey" id="mainEy">WORLD ADVERTISING MARKET</div><div class="name" id="mainName">Hover a country</div><div class="meta" id="mainMeta">Every country is an advertising opportunity.</div></div><button class="cta" id="mainCta">ADVERTISE</button></section><div class="tip" id="tip"><div class="ey" id="tipEy">AVAILABLE AD SPACE</div><h3 id="tipName">Country</h3><div class="advert" id="advert"></div><p id="tipMeta">Starting bid: 50 credits</p><button id="tipCta">CLAIM THIS COUNTRY</button></div><div class="modal" id="modal"><div class="card"><button class="close" id="close">×</button><h2 id="modalTitle">Advertise</h2><div class="sub" id="modalSub">Put your brand on the map.</div><form id="form"><div class="field"><label>BRAND NAME</label><input id="brand" required maxlength="48"></div><div class="field"><label>WEBSITE</label><input id="site" type="url" required placeholder="https://example.com"></div><div class="field"><label>LOGO FILE</label><div class="pick"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><b>Choose logo</b> · PNG/JPG/WEBP/SVG · 2MB</div></div><div class="field"><label>ADVERTISING MESSAGE</label><textarea id="tag" maxlength="120"></textarea></div><div class="field"><label>BID</label><input id="bid" type="number" min="50" value="50" required></div><button class="publish">PUBLISH ADVERTISEMENT</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script>const $=id=>document.getElementById(id),owners=new Map,colors=['#55eaff','#ff58b2','#baff55','#ffd34d','#a778ff','#ff745d','#43ffb0','#ff9348'];let countries=[],selected=null,logoData='';async function start(){try{const r=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');if(!r.ok)throw Error('map');const world=await r.json();countries=topojson.feature(world,world.objects.countries).features;const svg=d3.select('#map'),projection=d3.geoNaturalEarth1().fitExtent([[15,25],[1385,735]],{type:'Sphere'}),path=d3.geoPath(projection),root=svg.append('g'),layer=root.append('g'),marks=root.append('g');layer.selectAll('path').data(countries).join('path').attr('class','country').attr('d',path).attr('fill','#18394b').on('mouseenter',(e,d)=>tip(e,d)).on('mousemove',move).on('mouseleave',()=>$('tip').classList.remove('show')).on('click',(e,d)=>{selected=d;bottom()});function render(){layer.selectAll('path').attr('fill',d=>owners.get(+d.id)?.color||'#18394b');marks.selectAll('*').remove();const groups=new Map;owners.forEach((o,id)=>{if(!groups.has(o.brand))groups.set(o.brand,[]);groups.get(o.brand).push(id)});groups.forEach((ids,brand)=>{const pts=ids.map(id=>projection(d3.geoCentroid(countries.find(c=>+c.id===+id))));const x=pts.reduce((a,p)=>a+p[0],0)/pts.length,y=pts.reduce((a,p)=>a+p[1],0)/pts.length,o=owners.get(+ids[0]),w=Math.min(190,110+brand.length*4),g=marks.append('g').attr('transform',`translate(${x},${y})`).attr('pointer-events','none');g.append('rect').attr('x',-w/2).attr('y',-20).attr('width',w).attr('height',40).attr('rx',10).attr('fill','#07131ef2').attr('stroke',o.color);if(o.logo)g.append('image').attr('href',o.logo).attr('x',-w/2+5).attr('y',-15).attr('width',30).attr('height',30);g.append('text').attr('x',-w/2+42).attr('y',0).attr('fill','#fff').attr('font-size',Math.min(15,10+Math.sqrt(ids.length)*2)).attr('font-weight','900').text(brand.slice(0,20));g.append('text').attr('x',-w/2+42).attr('y',12).attr('fill','#9cafbb').attr('font-size',7).text(ids.length+' '+(ids.length===1?'country':'countries'))});$('claimed').textContent=owners.size;$('brands').textContent=new Set([...owners.values()].map(o=>o.brand)).size}function tip(e,d){const o=owners.get(+d.id);$('tipEy').textContent=o?'CURRENT ADVERTISER':'AVAILABLE AD SPACE';$('tipName').textContent=d.properties?.name||'Country';$('tipMeta').textContent=o?`${o.site} · Current bid ${o.bid} credits`:'Starting bid: 50 credits';const a=$('advert');a.innerHTML='';if(o){const l=document.createElement('div');l.className='advertLogo';if(o.logo){const im=document.createElement('img');im.src=o.logo;l.append(im)}else l.textContent=o.brand.slice(0,2).toUpperCase();const s=document.createElement('div');s.innerHTML='<b>'+o.brand+'</b>';a.append(l,s);$('tipCta').textContent='OUTBID ADVERTISER'}else $('tipCta').textContent='CLAIM THIS COUNTRY';$('tip').classList.add('show');move(e);$('tipCta').onclick=()=>openAd(d)}function move(e){const t=$('tip'),r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;t.style.left=x+'px';t.style.top=y+'px'}function bottom(){const o=selected&&owners.get(+selected.id);$('mainEy').textContent=o?'CURRENT ADVERTISER':'WORLD ADVERTISING MARKET';$('mainName').textContent=o?o.brand:(selected?.properties?.name||'Hover a country');$('mainMeta').textContent=o?`${o.site} · Current bid ${o.bid} credits`:'Open advertising space';$('mainCta').textContent=o?'OUTBID':'ADVERTISE';$('mainCta').onclick=()=>openAd(selected||countries[0]);if(o?.logo)$('mainLogo').innerHTML=`<img src="${o.logo}">`;else $('mainLogo').textContent=o?o.brand[0].toUpperCase():'W'}function openAd(d){selected=d;const o=owners.get(+d.id),min=o?Math.ceil(o.bid*1.15):50;$('modalTitle').textContent=o?'Outbid '+o.brand:'Advertise in '+(d.properties?.name||'this country');$('modalSub').textContent=o?'Beat the current bid to take this placement.':'Create your advertising placement.';$('bid').value=min;$('bid').min=min;$('modal').classList.add('show')}$('file').onchange=e=>{const f=e.target.files[0];if(!f||f.size>2097152)return;const r=new FileReader;r.onload=()=>logoData=r.result;r.readAsDataURL(f)};$('form').onsubmit=e=>{e.preventDefault();const id=+selected.id,o=owners.get(id),b=+$('bid').value,min=o?Math.ceil(o.bid*1.15):50;if(b<min)return alert('Minimum bid: '+min);const brand=$('brand').value.trim();owners.set(id,{brand,site:$('site').value.trim(),tag:$('tag').value.trim(),logo:logoData,bid:b,color:colors[new Set([...owners.values()].map(x=>x.brand)).size%colors.length]});$('modal').classList.remove('show');render();bottom()};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('advertise').onclick=()=>openAd(selected||countries[0]);$('how').onclick=()=>alert('Choose a country, upload your logo and bid. Existing advertising space can be outbid.');const zoom=d3.zoom().scaleExtent([1,8]).on('zoom',e=>root.attr('transform',e.transform));svg.call(zoom);render()}start()</script></body></html>

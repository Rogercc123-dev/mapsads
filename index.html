<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorldBid</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08131d;color:#fff;font-family:Arial,sans-serif}#map{position:fixed;inset:0;width:100%;height:100%;display:block}.country{fill:#18394c;stroke:#617987;stroke-width:.55;cursor:pointer}.country:hover{fill:#2e6e87;stroke:#68edff;stroke-width:1.5;filter:drop-shadow(0 0 6px #40e9ff)}.top,.bottom,.tip,.modalCard{background:rgba(6,18,28,.92);border:1px solid rgba(255,255,255,.14);box-shadow:0 15px 55px rgba(0,0,0,.55);backdrop-filter:blur(15px)}.top{position:fixed;z-index:10;top:12px;left:12px;right:12px;height:55px;border-radius:15px;padding:0 15px;display:flex;align-items:center;justify-content:space-between}.word{font-size:21px;font-weight:1000;letter-spacing:-1.5px}.word span{color:#59eaff}.nav{display:flex;gap:6px}.btn,.cta{border:0;border-radius:9px;padding:9px 13px;background:rgba(255,255,255,.07);color:#fff;font-size:9px;font-weight:900;cursor:pointer}.btn:hover{background:rgba(255,255,255,.14)}.cta{background:#59eaff;color:#031018}.stats{font-size:8px;color:#9fb1bc}.stats b{color:#fff}.bottom{position:fixed;z-index:10;left:50%;bottom:14px;transform:translateX(-50%);width:min(680px,calc(100% - 28px));border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px}.mainLogo{width:50px;height:50px;border-radius:11px;background:#102d3d;display:grid;place-items:center;overflow:hidden;font-weight:1000;flex:none}.mainLogo img{width:100%;height:100%;object-fit:contain}.copy{flex:1;min-width:0}.ey{font-size:7px;color:#59eaff;font-weight:1000;letter-spacing:1px}.name{font-size:14px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:8px;color:#9fb1bc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tip{position:fixed;z-index:20;display:none;min-width:205px;max-width:270px;border-radius:13px;padding:12px;pointer-events:none}.tip.show{display:block}.tip h3{margin:4px 0;font-size:16px}.tip p{margin:5px 0;color:#a4b5c0;font-size:8px}.adrow{display:flex;gap:8px;align-items:center;margin-top:8px}.adlogo{width:34px;height:34px;border-radius:8px;background:#102d3d;display:grid;place-items:center;overflow:hidden;font-size:8px;font-weight:1000}.adlogo img{width:100%;height:100%;object-fit:contain}.tipAction{margin-top:9px;width:100%;border:0;border-radius:8px;padding:9px;background:#baff55;color:#071000;font-size:8px;font-weight:1000;pointer-events:auto;cursor:pointer}.modal{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalCard{width:min(480px,100%);border-radius:17px;padding:19px}.close{float:right;border:0;background:rgba(255,255,255,.07);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}.modalCard h2{margin:0 40px 4px 0}.sub{font-size:9px;color:#9fb1bc;margin-bottom:15px}.field{margin:10px 0}.field label{display:block;font-size:7px;font-weight:1000;letter-spacing:1px;color:#9fb1bc;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #294554;border-radius:8px;background:#040b11;color:#fff}.field textarea{min-height:55px}.pick{position:relative;padding:11px;border:1px dashed #4a6675;border-radius:8px;font-size:9px;color:#a8b9c3}.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}.publish{width:100%;padding:11px;border:0;border-radius:9px;background:#59eaff;color:#031018;font-weight:1000;cursor:pointer}.status{position:fixed;z-index:9;top:78px;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:99px;background:rgba(6,18,28,.75);border:1px solid rgba(255,255,255,.12);font-size:8px;color:#9fb1bc}.status b{color:#baff55}@media(max-width:650px){.nav,.stats{display:none}.top{top:7px;left:7px;right:7px}.bottom{bottom:7px}}
</style>
</head>
<body>
<svg id="map" viewBox="0 0 1400 760"></svg>
<header class="top"><div class="word">WORLD<span>BID</span></div><div class="nav"><button class="btn" id="how">HOW IT WORKS</button><button class="btn" id="advertise">ADVERTISE</button></div><div class="stats"><b id="claimed">0</b> CLAIMED · <b id="brands">0</b> BRANDS</div></header>
<div class="status"><b>● LIVE MARKET</b> · <span id="statusText">loading world…</span></div>
<section class="bottom"><div class="mainLogo" id="mainLogo">W</div><div class="copy"><div class="ey" id="mainEy">WORLD ADVERTISING MARKET</div><div class="name" id="mainName">Hover a country</div><div class="meta" id="mainMeta">Every country is an advertising opportunity.</div></div><button class="cta" id="mainCta">ADVERTISE</button></section>
<div class="tip" id="tip"><div class="ey" id="tipEy">AVAILABLE AD SPACE</div><h3 id="tipName">Country</h3><div class="adrow" id="adrow"></div><p id="tipMeta">Starting bid: 50 credits</p><button class="tipAction" id="tipAction">CLAIM THIS COUNTRY</button></div>
<div class="modal" id="modal"><div class="modalCard"><button class="close" id="close">×</button><h2 id="modalTitle">Advertise</h2><div class="sub" id="modalSub">Put your brand on the map.</div><form id="form"><div class="field"><label>BRAND NAME</label><input id="brand" maxlength="48" required></div><div class="field"><label>WEBSITE</label><input id="site" type="url" placeholder="https://example.com" required></div><div class="field"><label>LOGO FILE</label><div class="pick"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><b>Choose logo</b> · max 2MB</div></div><div class="field"><label>MESSAGE</label><textarea id="tag" maxlength="120"></textarea></div><div class="field"><label>BID</label><input id="bid" type="number" min="50" value="50" required></div><button class="publish">PUBLISH ADVERTISEMENT</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(function(){
'use strict';
var owners={};var countries=[];var selected=null;var logoData='';
var colors=['#55eaff','#ff58b2','#baff55','#ffd34d','#a778ff','#ff745d','#43ffb0','#ff9348'];
function el(id){return document.getElementById(id)}
function nameOf(d){return d.properties&&d.properties.name||d.properties&&d.properties.NAME||'Country'}
function moveTip(e){var t=el('tip'),r=t.getBoundingClientRect(),x=e.clientX+15,y=e.clientY+15;if(x+r.width>innerWidth-8)x=e.clientX-r.width-15;if(y+r.height>innerHeight-8)y=e.clientY-r.height-15;t.style.left=x+'px';t.style.top=y+'px'}
function openAd(d){if(!d)return;selected=d;var old=owners[String(d.id)];var min=old?Math.ceil(old.bid*1.15):50;el('modalTitle').textContent=old?'Outbid '+old.brand:'Advertise in '+nameOf(d);el('modalSub').textContent=old?'Beat the current bid of '+old.bid+' credits.':'Create your advertising placement.';el('bid').value=min;el('bid').min=min;el('modal').classList.add('show')}
function showTip(e,d){var o=owners[String(d.id)];el('tipEy').textContent=o?'CURRENT ADVERTISER':'AVAILABLE AD SPACE';el('tipName').textContent=nameOf(d);el('tipMeta').textContent=o?o.site+' · Current bid '+o.bid+' credits':'Starting bid: 50 credits';var row=el('adrow');row.innerHTML='';if(o){var l=document.createElement('div');l.className='adlogo';if(o.logo){var im=document.createElement('img');im.src=o.logo;l.appendChild(im)}else l.textContent=o.brand.slice(0,2).toUpperCase();var s=document.createElement('div');s.innerHTML='<b>'+safe(o.brand)+'</b><div style="font-size:8px;color:#9fb1bc">'+safe(o.tag||'Advertising placement')+'</div>';row.appendChild(l);row.appendChild(s);el('tipAction').textContent='OUTBID ADVERTISER'}else{el('tipAction').textContent='CLAIM THIS COUNTRY'}el('tip').classList.add('show');moveTip(e);el('tipAction').onclick=function(){openAd(d)}}
function safe(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function bottom(){var o=selected&&owners[String(selected.id)];el('mainEy').textContent=o?'CURRENT ADVERTISER':'WORLD ADVERTISING MARKET';el('mainName').textContent=o?o.brand:nameOf(selected);el('mainMeta').textContent=o?o.site+' · Current bid '+o.bid+' credits':'Open advertising space';el('mainCta').textContent=o?'OUTBID':'ADVERTISE';if(o&&o.logo)el('mainLogo').innerHTML='<img src="'+o.logo+'">';else el('mainLogo').textContent=o?o.brand.charAt(0).toUpperCase():'W'}
function draw(){var svg=d3.select('#map');svg.selectAll('*').remove();var projection=d3.geoNaturalEarth1().fitExtent([[10,24],[1390,742]],{type:'Sphere'});var path=d3.geoPath(projection);var root=svg.append('g');var layer=root.append('g');var markers=root.append('g');layer.selectAll('path.country').data(countries).join('path').attr('class',function(d){return 'country '+(owners[String(d.id)]?'taken':'')}).attr('d',path).attr('fill',function(d){return owners[String(d.id)]?owners[String(d.id)].color:'#18394b'}).on('mouseenter',showTip).on('mousemove',moveTip).on('mouseleave',function(){el('tip').classList.remove('show')}).on('click',function(e,d){selected=d;bottom()});var groups={};Object.keys(owners).forEach(function(id){var o=owners[id];groups[o.brand]=groups[o.brand]||[];groups[o.brand].push(id)});Object.keys(groups).forEach(function(brand){var ids=groups[brand],pts=ids.map(function(id){var c=countries.find(function(x){return String(x.id)===id});return c?projection(d3.geoCentroid(c)):null}).filter(Boolean);if(!pts.length)return;var x=pts.reduce(function(a,p){return a+p[0]},0)/pts.length,y=pts.reduce(function(a,p){return a+p[1]},0)/pts.length,o=owners[ids[0]],g=markers.append('g').attr('transform','translate('+x+','+y+')').attr('pointer-events','none');g.append('circle').attr('r',25).attr('fill',o.color).attr('opacity',.22);g.append('text').attr('text-anchor','middle').attr('y',4).attr('fill','#fff').attr('font-size',12).attr('font-weight',900).text(brand.slice(0,18))});el('claimed').textContent=Object.keys(owners).length;var b={};Object.keys(owners).forEach(function(id){b[owners[id].brand]=1});el('brands').textContent=Object.keys(b).length;var zoom=d3.zoom().scaleExtent([1,7]).on('zoom',function(e){root.attr('transform',e.transform)});svg.call(zoom)}
function loadMap(){el('statusText').textContent='loading map…';fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(data){countries=topojson.feature(data,data.objects.countries).features;el('statusText').textContent='ready';draw()}).catch(function(err){console.error(err);el('statusText').textContent='map failed';el('mainName').textContent='Map failed to load';el('mainMeta').textContent='Refresh to retry.'})}
el('advertise').onclick=function(){openAd(selected||countries[0])};el('mainCta').onclick=function(){openAd(selected||countries[0])};el('how').onclick=function(){alert('Hover a country to see its advertising status. Empty countries can be claimed. Existing advertisers can be outbid with a higher bid.')};el('close').onclick=function(){el('modal').classList.remove('show')};el('modal').onclick=function(e){if(e.target===el('modal'))el('modal').classList.remove('show')};el('file').onchange=function(e){var f=e.target.files[0];if(!f)return;if(f.size>2097152)return alert('Logo must be under 2MB');var r=new FileReader();r.onload=function(){logoData=r.result};r.readAsDataURL(f)};el('form').onsubmit=function(e){e.preventDefault();if(!selected)return;var id=String(selected.id),old=owners[id],bid=Number(el('bid').value),min=old?Math.ceil(old.bid*1.15):50;if(bid<min)return alert('Minimum bid: '+min);var brand=el('brand').value.trim();owners[id]={brand:brand,site:el('site').value.trim(),tag:el('tag').value.trim(),logo:logoData,bid:bid,color:colors[Object.keys(owners).length%colors.length]};el('modal').classList.remove('show');draw();bottom()};loadMap();
})();
</script>
</body>
</html>
